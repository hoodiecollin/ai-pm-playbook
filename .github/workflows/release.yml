# Publish to npm on a version tag, using npm's OIDC trusted publishing.
#
# WHY THERE IS NO NPM_TOKEN HERE
#
# Trusted publishing lets npm verify the *workflow* that is asking to publish, via a short-lived
# OIDC token GitHub mints for this run. There is no long-lived credential to store, leak, rotate,
# or forget to rotate — and a stolen token cannot be replayed, because the identity being checked
# is "this repo, this workflow file", not "whoever holds this string".
#
# That identity check is also the reason the filename matters. npm is configured to trust
# `release.yml` on this repo specifically. RENAMING THIS FILE BREAKS PUBLISHING until the trusted
# publisher config on npmjs.com is updated to match.
#
# ONE-TIME SETUP (npmjs.com, by a package owner — cannot be done from CI):
#   Package → Settings → Publishing access → Trusted publisher → GitHub Actions
#     Organization or user:  hoodiecollin
#     Repository:            ai-pm-playbook
#     Workflow filename:     release.yml
#     Environment:           (leave blank — this workflow declares none)
#
# Until that is configured the publish step fails with a 404/403 on the OIDC exchange; the guard
# job below still runs, so a mismatched tag is caught either way.

name: Release

on:
  push:
    tags: ["v*"]

# `id-token: write` is what lets GitHub mint the OIDC token. Without it npm falls back to looking
# for a token it will not find. `contents: read` is the default-deny posture: this workflow
# publishes, it does not write to the repo.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      # `prepublishOnly` runs typecheck + test + build, so the tarball is never assembled from an
      # unverified tree. Bun must be on PATH before `npm publish` for that hook to work.
      #
      # THE MAJOR VERSION HERE IS NOT COSMETIC — v7 IS THE FLOOR FOR TRUSTED PUBLISHING.
      #
      # Every setup-node before v7 exported `NODE_AUTH_TOKEN` as the literal placeholder
      # `XXXXX-XXXXX-XXXXX-XXXXX` whenever `registry-url` was set and the caller had not supplied a
      # real token. The `.npmrc` it writes references that variable, so npm found a credential,
      # sent garbage, and never attempted the OIDC exchange. actions/setup-node#1558 ("Remove dummy
      # NODE_AUTH_TOKEN export") fixed it in v7: the variable is now exported only when the caller
      # actually set it.
      #
      # Both failure modes were observed on this repo before the bump, and neither error names the
      # real problem:
      #   v4 + registry-url  → `E404 Not Found - PUT .../@hoodiecollin%2fpm-playbook`, which reads
      #                        as "package does not exist" but is really "bad credential".
      #   v4 - registry-url  → `ENEEDAUTH ... you need to authorize this machine`, with no OIDC
      #                        attempt logged at all.
      # Provenance signs correctly either way — it takes the OIDC token straight from GitHub and
      # never touches the registry credential — so a signed provenance line is NOT evidence that
      # trusted publishing worked.
      #
      # `registry-url` IS required, per the recipe in actions/setup-node#1536: it is what writes the
      # userconfig naming registry.npmjs.org, which is the registry npm runs the exchange against.
      - uses: actions/setup-node@v7
        with:
          # 24 ships an npm that already clears the 11.5.1 floor; the step below is the guarantee.
          node-version: 24
          registry-url: https://registry.npmjs.org

      # npm added trusted publishing in 11.5.1. Pinning the floor rather than taking `@latest`
      # blindly keeps the failure mode legible if npm changes again.
      - name: Ensure npm supports trusted publishing
        run: |
          set -euo pipefail
          npm install -g npm@^11.5.1
          npm --version

      # The tag is the thing humans get wrong: `git tag v2.1.0` on a tree whose package.json still
      # says 2.0.1 publishes the wrong number, and npm will happily accept it. Fail before the
      # registry is touched, because a published version cannot be taken back.
      - name: Tag must match package.json
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${PKG}"
            exit 1
          fi
          echo "publishing ${PKG}"

      # `--provenance` attaches a signed, publicly verifiable statement of which workflow and which
      # commit produced this tarball. It is what makes the trusted-publisher identity visible to
      # consumers rather than only to npm.
      #
      # `--loglevel verbose` is not debugging left behind — it is the only way an OIDC failure is
      # visible at all. npm's `lib/utils/oidc.js` is written to NEVER THROW: every failure path
      # (no id-token permission, GitHub refused the token, the registry rejected the exchange)
      # logs at verbose or silly and returns `undefined`, and publish then proceeds with whatever
      # credential it already had. The resulting error describes that fallback, not the exchange —
      # which is how this workflow produced three different misleading errors in a row. At verbose,
      # the exchange logs `npm verb oidc` with the registry's own reason for saying no.
      - name: Publish
        run: npm publish --provenance --access public --loglevel verbose

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build

      # The CLI must run on stock Node, not just Bun — most consumers reach it via `npx`.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Smoke-test the bundle on Node
        run: |
          node dist/cli.js version
          node dist/cli.js rules
          node dist/cli.js check --no-remote

      # Prove that what a consumer installs actually works, rather than trusting the source tree.
      - name: End-to-end install into a fresh repo
        run: |
          set -euo pipefail
          npm pack --pack-destination /tmp
          mkdir -p /tmp/consumer && cd /tmp/consumer
          git init -q . && npm init -y >/dev/null
          npm i -D /tmp/*.tgz >/dev/null
          npx @hoodiecollin/pm-playbook init
          test -f .pm-playbook/AGENT.md
          test -f .pm-playbook/manifest.json
          test -f .github/ISSUE_TEMPLATE/improvement.md
          grep -q 'pm-playbook:begin' AGENTS.md
          # A clean adoption must be violation-free, and re-running must change nothing.
          npx @hoodiecollin/pm-playbook check --no-remote --strict
          npx @hoodiecollin/pm-playbook init | grep -q 'already current'
          # A fresh adoption is born current: bootstrap creates today's taxonomy directly, so
          # there is never migration history to replay into it. Compared against the CLI's own
          # version rather than a hardcoded prefix, which silently stops testing anything the
          # moment the major changes.
          VERSION="$(npx @hoodiecollin/pm-playbook version)"
          grep -q "\"migratedThrough\": \"${VERSION}\"" .pm-playbook/manifest.json
          npx @hoodiecollin/pm-playbook migrate | grep -q 'No pending label migrations'

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Claude Code
        run: npm i -g @anthropic-ai/claude-code
      # --strict so a misspelled manifest field fails here rather than at a user's install.
      # This catches unparseable skill/command frontmatter, which otherwise loads with all
      # metadata silently dropped — a skill that never triggers and reports no error.
      - run: claude plugin validate . --strict
      - run: claude plugin validate ./plugins/pm-playbook --strict

  lint-backlog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      # Dogfood: this repo's own backlog must satisfy the invariants it ships.
      - run: node dist/cli.js check --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
